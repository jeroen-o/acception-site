 try{const h=await accDec(accNorm(pw),P);try{sessionStorage.setItem("acc_pw",accNorm(pw));}catch(e){}document.open();document.write(h);document.close();return true;}
 catch(e){if(!quiet)document.getElementById("er").textContent="Onjuist wachtwoord.";return false;}}
document.getElementById("lk").addEventListener("submit",e=>{e.preventDefault();open_(document.getElementById("pw").value,false);});
