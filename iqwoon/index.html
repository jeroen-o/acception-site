 const k=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(s),iterations:n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function accDec(pw,o){const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));const k=await accKey(pw,o.s,o.n);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(o.i)},k,b(o.c)));}
